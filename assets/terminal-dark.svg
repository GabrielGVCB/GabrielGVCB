<svg width="700" height="230" viewBox="0 0 700 230" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .win   { fill:#0d1117; stroke:#30363d; }
    .bar   { fill:#161b22; }
    .dot   { fill:#30363d; }
    .title { font-family:'Fira Code','Courier New',monospace; font-size:12px; fill:#8b949e; }
    .txt   { font-family:'Fira Code','Courier New',monospace; font-size:15px; fill:#c9d1d9; }
    .cmd   { fill:#58a6ff; }
    .out   { fill:#8b949e; }
    .cursor{ fill:#58a6ff; animation:blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity:0; } }
  </style>

  <rect x="1" y="1" width="698" height="228" rx="8" class="win"/>
  <rect x="1" y="1" width="698" height="36" rx="8" class="bar"/>
  <circle cx="24" cy="19" r="6" class="dot"/>
  <circle cx="44" cy="19" r="6" class="dot"/>
  <circle cx="64" cy="19" r="6" class="dot"/>
  <text x="350" y="24" text-anchor="middle" class="title">gabriel@dev — zsh</text>

  <text x="24" y="72" class="txt"><tspan class="cmd">$</tspan> whoami</text>
  <text x="24" y="98" class="txt out">gabriel batista — full stack developer</text>

  <text x="24" y="140" class="txt"><tspan class="cmd">$</tspan> cat agora.txt</text>
  <text x="24" y="166" class="txt out">construindo novas funcionalidades na UltraLims</text>
  <text x="24" y="188" class="txt out">estudando arquitetura de software e design patterns</text>

  <rect x="24" y="198" width="10" height="18" class="cursor"/>
</svg>
